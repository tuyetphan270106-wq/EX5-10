<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../public/boostrap/css/bootstrap.min.css" rel="stylesheet" />
    <title>Document</title>
</head>

<body>
    <div class="container mt-2">
        <!-- Alert -->
        <div class="alert alert-warning alert-dismissible fade show" role="alert">
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <h1>Form đặt vé máy bay</h1>
        <form>
            <div class="form-group mt-2">
                <label for="inputHoten" class="form-label">Họ tên</label>
                <div class="input-group">
                    <span class="input-group-text">♙</span>
                    <input type="text" id="inputHoten" class="form-control" aria-describedby="passwordHelpBlock"
                        placeholder="Họ tên">
                    <span class="input-group-text">vnđ</span>
                </div>
                <div id="passwordHelpBlock" class="form-text">
                    Phải nhập 5 kí tự in hoa.
                </div>
            </div>
            <div class="form-group mt-2">
                <label for="inputDiachi" class="form-label">Địa chỉ</label>
                <div class="input-group">
                    <input type="text" id="inputDiachi" class="form-control" aria-describedby="DiachiHelpBlock">
                </div>
                <div id="DiachiHelpBlock" class="form-text">Phải nhập 5 kí tự in hoa.</div>
            </div>
            <div class="form-group row mt-2">
                <div class="col-md-6">
                    <label for="from" class="form-label">Đi từ</label>
                    <select class="form-select">
                        <option>Hà Nội</option>
                        <option>TP Hồ Chí Minh</option>
                        <option>Đà Nãng</option>
                        <option>Cà Mau</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="to" class="form-label">Đến</label>
                    <select class="form-select">
                        <option>Hà Nội</option>
                        <option>TP Hồ Chí Minh</option>
                        <option>Đà Nãng</option>
                        <option>Cà Mau</option>
                    </select>
                </div>
            </div>
            <div class="form-group mt-2">
                <label for="Choose" class="form-label">Chọn chiều đi(Khứ hồi)</label>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="di">

                    <label class="form-check-label" for="di">
                        Đi
                    </label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="ve">

                    <label class="form-check-label" for="ve">
                        Về
                    </label>
                </div>
            </div>
            <!-- Button -->
            <button type="submit" class="btn btn-primary w-100 mt-2">
                Đặt vé
            </button>
        </form>
    </div>

    <script src="../public/boostrap/js/bootstrap.bundle.min.js" />
</body>

</html>
