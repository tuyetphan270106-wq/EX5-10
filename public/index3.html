<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../public/boostrap/css/bootstrap.min.css" rel="stylesheet" />
    <title>Document</title>
    <style>
        .header {
            background-color: #e9ecef;
            padding: 45px 25px;
            margin-bottom: 22px;
        }

        .header h2 {
            margin: 0;
            font-size: 28px;
        }

        .grid-box {
            background-color: #d3d3d3;
            border: 1px solid #999;
            height: 48px;
            padding: 5px 10px;
            font-size: 12px;
        }

        .footer {
            background-color: #d8cccc;
            text-align: center;
            font-size: 28px;
            margin-top: 20px;
            padding: 3px;
        }
        .link{
            display: flex;
            
        }
        .link p{
            margin-right: 20px;
        }
    </style>
</head>
<body>
    <div class="container-fluid">

        <!-- Header -->
        <div class="header">
            <h2>Let's test the grid!</h2>
        </div>
        <div class="link">
            <p><a class="link-offset-1 link-underline link-underline-opacity-0" href="#">Active</a></p>
            <p><a class="link-offset-2 link-underline link-underline-opacity-0" href="#">Link</a></p>
            <p><a class="link-offset-2 link-underline link-underline-opacity-0" href="#">Link</a></p>
            <p><a href="#" class="link-secondary  link-offset-2 link-underline link-underline-opacity-0">Disable</a></p>
        </div>
        <!-- Row 1: 6 + 6 -->
        <div class="row justify-content-center">
            <div class="col-6 grid-box">
                First col
            </div>

            <div class="col-6 grid-box">
                Second col
            </div>
        </div>

        <!-- Row 2: 4 + 4 + 4 -->
        <div class="row justify-content-center">
            <div class="col-4 grid-box">
                col
            </div>

            <div class="col-4 grid-box">
                col
            </div>

            <div class="col-4 grid-box">
                col
            </div>
        </div>

        <!-- Row 3: 3 + 3 + 3 + 3 -->
        <div class="row justify-content-center">
            <div class="col-3 grid-box">
                col
            </div>

            <div class="col-3 grid-box">
                col
            </div>

            <div class="col-3 grid-box">
                col
            </div>

            <div class="col-3 grid-box">
                col
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            Created by Phan Tuyet!
        </div>
    </div>
    <script src="../public/boostrap/js/bootstrap.bundle.min.js" />
</body>
</html>
